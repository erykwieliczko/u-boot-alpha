set root=(memdisk)
set prefix=(memdisk)/boot/grub
set timeout_style=menu
set timeout=5
set default=0
set gfxmode=auto
set gfxpayload=keep
terminal_input console
terminal_output console
echo 'Neo GRUB: single-CPU Linux initramfs bring-up.'
if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod efi_gop
    insmod gfxterm
    terminal_output gfxterm
fi
menuentry 'Neo Linux - RAM-only BusyBox bring-up' {
    echo 'Loading Linux and its embedded initramfs...'
    linux /boot/Image earlycon=s5l_t8140,mmio32,0x385200000 keep_bootcon console=tty0 loglevel=7 ignore_loglevel maxcpus=1 nr_cpus=1 clk_ignore_unused initcall_debug panic=0 fbcon=font:TER16x32
}
menuentry 'Return to U-Boot' {
    exit
}
