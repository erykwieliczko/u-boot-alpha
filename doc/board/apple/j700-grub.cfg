set root=(memdisk)
set prefix=(memdisk)/boot/grub
set timeout_style=menu
set timeout=-1
set default=0
set gfxmode=auto
set gfxpayload=keep

terminal_input console
terminal_output console
echo 'Neo GRUB playground: infinite timeout; demo entries do not boot an OS.'
if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod efi_gop
    insmod gfxterm
    terminal_output gfxterm
fi

menuentry 'Neo: there is no spoon (demo)' {
    echo 'You are the One. The keyboard is your superpower.'
    echo 'Returning to the menu in five seconds; any key skips the wait.'
    sleep --interruptible 5
}

menuentry 'Definitely Not Fedora (also a demo)' {
    echo 'Definitely not booting Fedora. This is a keyboard playground!'
    sleep --interruptible 5
}

menuentry 'macOS has left the chat (demo)' {
    echo 'No operating systems were harmed in the making of this menu.'
    sleep --interruptible 5
}

menuentry 'NVMe treasure chest: list the development ESP' {
    if search --no-floppy --label --set=neoesp EFI-M1N1; then
        echo 'Files on the development ESP:'
        ls ($neoesp)/
    else
        echo 'Development ESP not found; no disks were changed.'
    fi
    sleep --interruptible 10
}

menuentry 'Keyboard playground: type a message' {
    echo 'Type a message, then press Enter:'
    read message
    echo "You typed: $message"
    sleep --interruptible 10
}

submenu 'Even more entirely serious operating systems...' {
    menuentry 'PenguinOS: now with 100 percent more penguins' {
        echo 'Penguins are still on their way. Enjoy GRUB in the meantime.'
        sleep --interruptible 5
    }
    menuentry 'PotatoOS Professional Enterprise Ultimate' {
        echo 'Your potato subscription has been extended indefinitely.'
        sleep --interruptible 5
    }
}

menuentry 'Return to the U-Boot prompt' {
    exit
}
